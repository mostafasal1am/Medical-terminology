<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Terminology Quiz — BY MOSTAFA SALLAM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#080f1e;
  --card-bg:#0e1830;
  --border:#1e3a5f;
  --blue:#1a6bdc;
  --blue-light:#4a9eff;
  --cyan:#22d4e8;
  --emerald:#10c97e;
  --red:#f25555;
  --gold:#f5c842;
  --text-white:#f0f4ff;
  --text-muted:#7a90b8;
  --text-dark:#0a1628;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:80px;
}
/* ─── BG ─── */
.bg-mesh{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%,rgba(26,107,220,.18) 0%,transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 70%,rgba(34,212,232,.12) 0%,transparent 60%),
    radial-gradient(ellipse 40% 50% at 50% 50%,rgba(8,15,30,1) 0%,transparent 100%);
}
/* ─── START SCREEN ─── */
#startScreen{
  position:relative;z-index:1;
  max-width:700px;margin:0 auto;
  padding:40px 20px;
  display:flex;flex-direction:column;align-items:center;
}
.logo-area{
  margin-bottom:36px;text-align:center;
  animation:fadeDown .6s ease both;
}
.logo-icon{
  font-size:4em;display:block;margin-bottom:14px;
  filter:drop-shadow(0 0 24px rgba(74,158,255,.6));
  animation:pulse-icon 3s ease-in-out infinite;
}
@keyframes pulse-icon{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.logo-title{
  font-family:'Playfair Display',serif;
  font-size:2.6em;font-weight:900;
  background:linear-gradient(135deg,#fff 30%,var(--blue-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.15;margin-bottom:6px;
}
.logo-sub{
  color:var(--blue-light);font-size:.95em;
  opacity:.85;letter-spacing:.02em;
}
.byline{
  margin-top:12px;font-size:.8em;color:var(--text-muted);
  letter-spacing:.12em;text-transform:uppercase;
}
.byline strong{
  color:var(--blue-light);font-family:'Playfair Display',serif;
  font-size:1.15em;letter-spacing:.15em;
}
/* start card */
.start-card{
  width:100%;
  background:rgba(14,24,48,.85);
  backdrop-filter:blur(24px);
  border:1px solid rgba(74,158,255,.2);
  border-radius:24px;
  padding:40px 36px;
  box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  animation:fadeUp .7s .1s ease both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.section-label{
  color:var(--text-muted);font-size:.78em;
  font-weight:600;text-transform:uppercase;letter-spacing:.12em;
  margin-bottom:12px;
}
.filter-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.filter-btn{
  padding:8px 18px;border-radius:20px;cursor:pointer;
  font-size:.85em;font-weight:500;
  transition:all .2s;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  color:var(--text-muted);
  font-family:'DM Sans',sans-serif;
}
.filter-btn:hover{border-color:var(--blue-light);color:var(--blue-light);}
.filter-btn.active{
  background:linear-gradient(135deg,rgba(26,107,220,.4),rgba(74,158,255,.15));
  border-color:var(--blue-light);color:var(--blue-light);
  box-shadow:0 0 16px rgba(74,158,255,.2);
}
.count-info{
  text-align:center;color:var(--text-muted);font-size:.92em;
  margin-bottom:24px;padding:12px 20px;
  background:rgba(255,255,255,.04);border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
}
.count-info span{color:var(--cyan);font-weight:700;font-size:1.2em;}
.btn-start{
  width:100%;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--blue),#0d47a1);
  color:#fff;font-size:1.1em;font-weight:700;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  transition:all .25s;
  box-shadow:0 8px 30px rgba(26,107,220,.5);
  letter-spacing:.03em;
}
.btn-start:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(26,107,220,.65);}
/* ─── QUIZ ─── */
#quizWrapper{display:none;position:relative;z-index:1;padding:30px 0;}
/* top mini-bar (inline, not sticky) */
.quiz-topbar{
  max-width:860px;margin:0 auto 20px;
  padding:12px 20px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.pill{
  padding:5px 14px;border-radius:20px;
  font-size:.8em;font-weight:600;white-space:nowrap;
}
.pill-q{background:rgba(255,255,255,.08);color:#c8d8f0;border:1px solid rgba(255,255,255,.15);}
.pill-c{background:rgba(16,201,126,.15);color:#6ee7b7;border:1px solid var(--emerald);}
.pill-w{background:rgba(242,85,85,.15);color:#fca5a5;border:1px solid var(--red);}
.pill-p{background:rgba(74,158,255,.15);color:#90caf9;border:1px solid var(--blue-light);}
.prog-wrap{flex:1;background:rgba(255,255,255,.08);border-radius:8px;height:6px;min-width:80px;overflow:hidden;}
.prog-fill{background:linear-gradient(90deg,var(--blue),var(--cyan));height:100%;border-radius:8px;transition:width .5s;}
/* ─── Q CARD ─── */
.q-card{
  max-width:860px;margin:16px auto;
  padding:28px 32px;
  background:rgba(255,255,255,.97);
  border-radius:20px;
  box-shadow:0 6px 40px rgba(0,0,0,.35);
  border-left:5px solid rgba(26,107,220,.25);
  transition:border-color .35s,box-shadow .35s;
  animation:slideIn .35s ease both;
}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.q-card.answered-correct{border-left-color:var(--emerald);box-shadow:0 6px 40px rgba(16,201,126,.15);}
.q-card.answered-wrong{border-left-color:var(--red);box-shadow:0 6px 40px rgba(242,85,85,.15);}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.q-num{
  background:linear-gradient(135deg,var(--blue),#0d47a1);
  color:#fff;min-width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85em;flex-shrink:0;
}
.cat-tag{padding:3px 12px;border-radius:20px;font-size:.72em;font-weight:600;color:#fff;}
.cat-tag.mcq{background:linear-gradient(135deg,#1565c0,#0d47a1);}
.cat-tag.tf{background:linear-gradient(135deg,#00897b,#00695c);}
/* bilingual question text */
.q-text{margin-bottom:18px;}
.q-en{
  font-size:1.06em;font-weight:600;color:#0f172a;
  line-height:1.6;margin-bottom:6px;
}
.q-ar{
  font-family:'Tajawal',sans-serif;
  font-size:.97em;font-weight:500;
  color:#2a4a7f;
  line-height:1.7;
  direction:rtl;text-align:right;
  border-right:3px solid rgba(26,107,220,.3);
  padding-right:10px;
  background:rgba(26,107,220,.04);
  border-radius:0 6px 6px 0;
  padding:6px 12px 6px 0;
}
/* options */
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{
  padding:11px 16px;
  border:2px solid #e2e8f0;border-radius:12px;
  cursor:pointer;font-size:.94em;text-align:left;
  background:#fff;color:#334155;
  transition:all .18s;
  font-family:'DM Sans',sans-serif;
  display:flex;align-items:flex-start;gap:10px;width:100%;
}
.opt-letter{
  width:28px;height:28px;border-radius:50%;
  background:#f1f5f9;border:2px solid #cbd5e1;
  display:flex;align-items:center;justify-content:center;
  font-size:.8em;font-weight:700;color:#64748b;
  flex-shrink:0;transition:all .18s;
  margin-top:2px;
}
.opt-content{display:flex;flex-direction:column;gap:2px;flex:1;}
.opt-en{font-size:.94em;line-height:1.4;color:#1e293b;}
.opt-ar{
  font-family:'Tajawal',sans-serif;
  font-size:.88em;color:#5578a0;
  direction:rtl;text-align:right;
  line-height:1.4;font-weight:500;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:#eff6ff;transform:translateX(4px);}
.opt:hover:not(:disabled) .opt-letter{background:var(--blue);border-color:var(--blue);color:#fff;}
.opt.correct{border-color:var(--emerald);background:#f0fdf4;}
.opt.correct .opt-en{color:#065f46;font-weight:600;}
.opt.correct .opt-ar{color:#0a7a52;}
.opt.correct .opt-letter{background:var(--emerald);border-color:var(--emerald);color:#fff;}
.opt.wrong{border-color:var(--red);background:#fef2f2;}
.opt.wrong .opt-en{color:#7f1d1d;}
.opt.wrong .opt-ar{color:#9b2222;}
.opt.wrong .opt-letter{background:var(--red);border-color:var(--red);color:#fff;}
.opt:disabled{cursor:default;}
/* feedback */
.q-feedback{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:.9em;display:none;}
.q-feedback.correct{background:#f0fdf4;border-left:4px solid var(--emerald);}
.q-feedback.wrong{background:#fef2f2;border-left:4px solid var(--red);}
.fb-en{font-weight:600;line-height:1.7;color:#1e293b;margin-bottom:6px;}
.q-feedback.correct .fb-en{color:#065f46;}
.q-feedback.wrong .fb-en{color:#7f1d1d;}
.fb-ar{
  font-family:'Tajawal',sans-serif;
  font-size:.95em;font-weight:500;
  line-height:1.8;direction:rtl;text-align:right;
  color:#334155;
  border-top:1px dashed rgba(0,0,0,.1);
  padding-top:6px;margin-top:4px;
}
.q-feedback.correct .fb-ar{color:#0a6645;}
.q-feedback.wrong .fb-ar{color:#8b1c1c;}
/* ─── SUBMIT ─── */
.submit-wrap{max-width:860px;margin:24px auto;text-align:center;padding:0 20px;}
.btn-submit{
  padding:16px 70px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--blue),#0d47a1);
  color:#fff;font-size:1.1em;font-weight:700;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  transition:all .2s;box-shadow:0 8px 30px rgba(26,107,220,.5);
}
.btn-submit:hover{transform:translateY(-3px);}
.btn-submit:disabled{opacity:.35;cursor:not-allowed;transform:none;}
/* ─── RESULTS ─── */
#resultsBox{
  max-width:860px;margin:24px auto;padding:44px 40px;
  background:rgba(255,255,255,.97);border-radius:24px;
  text-align:center;display:none;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  animation:slideIn .4s ease;
}
#resultsBox h2{
  font-family:'Playfair Display',serif;
  color:var(--text-dark);font-size:2.1em;margin-bottom:8px;
}
.score-ring{width:160px;height:160px;margin:20px auto;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:#e2e8f0;stroke-width:12;}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-center .big{font-size:2.4em;font-weight:900;color:var(--text-dark);font-family:'Playfair Display',serif;}
.score-center .small{font-size:.8em;color:#64748b;}
.result-msg{font-size:1.05em;color:#475569;margin:10px 0 24px;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-card{border-radius:16px;padding:16px 10px;}
.stat-card.c{background:#f0fdf4;border:2px solid var(--emerald);}
.stat-card.w{background:#fef2f2;border:2px solid var(--red);}
.stat-card.p{background:#eff6ff;border:2px solid var(--blue-light);}
.stat-card .num{font-size:2em;font-weight:900;font-family:'Playfair Display',serif;}
.stat-card.c .num{color:var(--emerald);}
.stat-card.w .num{color:var(--red);}
.stat-card.p .num{color:var(--blue);}
.stat-card .lbl{font-size:.8em;color:#64748b;margin-top:4px;}
.btn-re,.btn-home{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-size:1.05em;font-weight:700;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  margin-bottom:10px;transition:all .2s;
}
.btn-re{background:linear-gradient(135deg,var(--blue),#0d47a1);color:#fff;}
.btn-home{background:#f1f5f9;color:#475569;}
.btn-re:hover{transform:translateY(-2px);}
.btn-home:hover{background:#e2e8f0;}
.review-section{text-align:left;margin-top:24px;}
.review-section h3{color:var(--text-dark);font-size:1.1em;margin-bottom:14px;font-family:'Playfair Display',serif;}
.rev-item{padding:14px 16px;border-radius:12px;margin-bottom:10px;font-size:.88em;line-height:1.6;}
.rev-item.wrong{background:#fef2f2;border-left:4px solid var(--red);}
.rev-item .rt-en{font-weight:700;color:#1e293b;margin-bottom:2px;}
.rev-item .rt-ar{font-family:'Tajawal',sans-serif;font-size:.92em;color:#5578a0;direction:rtl;text-align:right;margin-bottom:6px;}
.rev-item .ans{color:#065f46;font-weight:600;margin-bottom:4px;}
.rev-item .exp{color:#64748b;font-size:.9em;margin-top:4px;}
.rev-item .exp-ar{font-family:'Tajawal',sans-serif;font-size:.9em;color:#5578a0;direction:rtl;text-align:right;margin-top:4px;}
/* ─── RESPONSIVE ─── */
@media(max-width:600px){
  .start-card{padding:28px 18px;}
  .logo-title{font-size:2em;}
  .q-card{padding:20px 16px;margin:12px 10px;}
  #resultsBox{padding:28px 18px;}
  .btn-submit{padding:14px 40px;}
}
</style>
</head>
<body>
<div class="bg-mesh"></div>

<!-- ─── START SCREEN ─── -->
<div id="startScreen">
  <div class="logo-area">
    <span class="logo-icon">🩺</span>
    <h1 class="logo-title">Medical Terminology Quiz</h1>
    <p class="logo-sub">2nd Term · MCQ · True/False — Full Revision</p>
    <div class="byline" style="margin-top:14px;">
      <span style="display:block;font-size:.75em;letter-spacing:.12em;margin-bottom:3px;">DESIGNED &amp; DEVELOPED BY</span>
      <strong>𝑴𝑶𝑺𝑻𝑨𝑭𝑨 𝑺𝑨𝑳𝑳𝑨𝑴</strong>
    </div>
  </div>

  <div class="start-card">
    <p class="section-label">Choose Section / اختر القسم</p>
    <div class="filter-group">
      <button class="filter-btn active" onclick="selectCat('all',this)">📚 All Questions</button>
      <button class="filter-btn" onclick="selectCat('mcq',this)">📝 MCQ Only</button>
      <button class="filter-btn" onclick="selectCat('tf',this)">✅ True / False Only</button>
    </div>
    <div class="count-info">Number of questions: <span id="qCount">0</span></div>
    <button class="btn-start" onclick="startQuiz()">Start Quiz ▶ ابدأ الكويز</button>
  </div>
</div>

<!-- ─── QUIZ WRAPPER ─── -->
<div id="quizWrapper">
  <!-- inline progress bar (not sticky) -->
  <div class="quiz-topbar">
    <div class="pill pill-q" id="sNum">0/0</div>
    <div class="pill pill-c" id="sC">✅ 0</div>
    <div class="pill pill-w" id="sW">❌ 0</div>
    <div class="pill pill-p" id="sP">📊 0%</div>
    <div class="prog-wrap"><div class="prog-fill" id="sFill" style="width:0%"></div></div>
  </div>

  <div id="cardsContainer"></div>

  <div class="submit-wrap">
    <button class="btn-submit" id="submitBtn" onclick="showResults()" disabled>Show Results 🎯</button>
  </div>

  <div id="resultsBox">
    <h2>🎉 Quiz Complete!</h2>
    <div class="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1a6bdc"/>
            <stop offset="100%" stop-color="#22d4e8"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="80" cy="80" r="64"/>
        <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="64" stroke-dasharray="402" stroke-dashoffset="402"/>
      </svg>
      <div class="score-center">
        <span class="big" id="rScore">0</span>
        <span class="small">out of <span id="rTotal">0</span></span>
      </div>
    </div>
    <div class="result-msg" id="rMsg"></div>
    <div class="stats-grid">
      <div class="stat-card c"><div class="num" id="rC">0</div><div class="lbl">✅ Correct</div></div>
      <div class="stat-card w"><div class="num" id="rW">0</div><div class="lbl">❌ Wrong</div></div>
      <div class="stat-card p"><div class="num" id="rP">0%</div><div class="lbl">📊 Score</div></div>
    </div>
    <button class="btn-re" onclick="startQuiz()">🔄 Retry Quiz</button>
    <button class="btn-home" onclick="goHome()">🏠 Home</button>
    <div class="review-section" id="reviewDiv"></div>
  </div>
</div>

<script>
const L=['A','B','C','D'];
let cat='all',qs=[],ans=0,cor=0,wr=0;

const MCQ=[
{cat:'mcq',q:"Which term refers to the medical study of the digestive system?",ar:"أي مصطلح يشير إلى الدراسة الطبية للجهاز الهضمي؟",opts:["Gastroenterology","Proctology","Endocrinology","Nephrology"],arOpts:["طب الجهاز الهضمي","طب المستقيم","طب الغدد الصماء","طب الكلى"],c:0,exp:"Gastroenterology is the branch of medicine focused on the digestive system and its disorders.",arExp:"طب الجهاز الهضمي (Gastroenterology) هو فرع الطب المتخصص في الجهاز الهضمي وأمراضه."},
{cat:'mcq',q:'The term "stomat/o" refers to which part of the digestive system?',ar:'مصطلح "stomat/o" يشير إلى أي جزء من الجهاز الهضمي؟',opts:["Esophagus","Stomach","Mouth","Intestine"],arOpts:["المريء","المعدة","الفم","الأمعاء"],c:2,exp:"Stomat/o is the combining form meaning mouth — the beginning of the digestive tract.",arExp:'"stomat/o" هو الجذر المركب الذي يعني الفم — بداية الجهاز الهضمي.'},
{cat:'mcq',q:"What is the term for inflammation of the stomach?",ar:"ما هو المصطلح الطبي لالتهاب المعدة؟",opts:["Gastritis","Enteritis","Hepatitis","Cholecystitis"],arOpts:["التهاب المعدة","التهاب الأمعاء الدقيقة","التهاب الكبد","التهاب المرارة"],c:0,exp:"Gastritis = gastr (stomach) + itis (inflammation) — inflammation of the stomach lining.",arExp:"التهاب المعدة (Gastritis) = gastr (معدة) + itis (التهاب) — التهاب بطانة المعدة."},
{cat:'mcq',q:'The term "hepat/o" refers to which organ?',ar:'مصطلح "hepat/o" يشير إلى أي عضو؟',opts:["Pancreas","Liver","Kidney","Gallbladder"],arOpts:["البنكرياس","الكبد","الكلية","المرارة"],c:1,exp:"Hepat/o is the combining form for liver — used in terms like hepatitis, hepatomegaly.",arExp:'"hepat/o" هو الجذر المركب للكبد — يُستخدم في مصطلحات مثل التهاب الكبد وتضخم الكبد.'},
{cat:'mcq',q:'The suffix "-phagia" means:',ar:'اللاحقة "-phagia" تعني:',opts:["Swallowing","Digestion","Secretion","Defecation"],arOpts:["البلع","الهضم","الإفراز","التغوط"],c:0,exp:"-phagia means swallowing or eating — e.g., dysphagia = difficulty swallowing.",arExp:'اللاحقة "-phagia" تعني البلع أو الأكل — مثل عسر البلع (dysphagia).'},
{cat:'mcq',q:'What does "cholelithiasis" refer to?',ar:'ماذا يعني مصطلح "cholelithiasis"؟',opts:["Inflammation of the pancreas","Formation of gallstones","Presence of ulcers","Enlargement of the liver"],arOpts:["التهاب البنكرياس","تكون حصوات المرارة","وجود قرحات","تضخم الكبد"],c:1,exp:"Cholelithiasis: chole (bile/gallbladder) + lith (stone) + iasis (condition) = formation of gallstones.",arExp:"تحصي المرارة (Cholelithiasis): chole (صفراء) + lith (حجر) + iasis (حالة) = تكون حصوات المرارة."},
{cat:'mcq',q:"The medical term for difficulty swallowing is:",ar:"المصطلح الطبي لصعوبة البلع هو:",opts:["Dysphagia","Dyspepsia","Dysphonia","Dysuria"],arOpts:["عسر البلع","عسر الهضم","عسر الصوت","عسر البول"],c:0,exp:"Dysphagia: dys (difficult) + phagia (swallowing) = difficulty swallowing.",arExp:"عسر البلع (Dysphagia): dys (صعوبة) + phagia (بلع) = صعوبة البلع."},
{cat:'mcq',q:"What is the term for the surgical removal of the gallbladder?",ar:"ما هو المصطلح لاستئصال المرارة جراحيًا؟",opts:["Cholecystectomy","Cholecystitis","Hepatectomy","Colectomy"],arOpts:["استئصال المرارة","التهاب المرارة","استئصال الكبد","استئصال القولون"],c:0,exp:"Cholecystectomy: cholecyst (gallbladder) + ectomy (surgical removal) = removal of the gallbladder.",arExp:"استئصال المرارة (Cholecystectomy): cholecyst (مرارة) + ectomy (استئصال) = إزالة المرارة جراحيًا."},
{cat:'mcq',q:'The combining form "proct/o" refers to:',ar:'الجذر المركب "proct/o" يشير إلى:',opts:["Stomach","Rectum and anus","Liver","Pancreas"],arOpts:["المعدة","المستقيم والشرج","الكبد","البنكرياس"],c:1,exp:"Proct/o is the combining form for rectum and anus — used in terms like proctology, proctitis.",arExp:'"proct/o" هو الجذر المركب للمستقيم والشرج — يُستخدم في مصطلحات مثل طب المستقيم والتهاب المستقيم.'},
{cat:'mcq',q:"The condition characterized by inflammation of the small intestine is:",ar:"الحالة التي تتميز بالتهاب الأمعاء الدقيقة هي:",opts:["Enteritis","Gastritis","Proctitis","Hepatitis"],arOpts:["التهاب الأمعاء الدقيقة","التهاب المعدة","التهاب المستقيم","التهاب الكبد"],c:0,exp:"Enteritis: enter (intestine) + itis (inflammation) = inflammation of the small intestine.",arExp:"التهاب الأمعاء الدقيقة (Enteritis): enter (أمعاء) + itis (التهاب) = التهاب الأمعاء الدقيقة."},
{cat:'mcq',q:'The term "steatorrhea" refers to:',ar:'مصطلح "steatorrhea" يشير إلى:',opts:["Blood in the stool","Excessive fat in the stool","Frequent urination","Inflammation of the rectum"],arOpts:["دم في البراز","دهون زائدة في البراز","كثرة التبول","التهاب المستقيم"],c:1,exp:"Steatorrhea: steat (fat) + rrhea (flow/discharge) = excessive fat in the stool, indicating malabsorption.",arExp:"الإسهال الدهني (Steatorrhea): steat (دهن) + rrhea (تدفق) = دهون زائدة في البراز تشير إلى سوء الامتصاص."},
{cat:'mcq',q:'The suffix "-emesis" means:',ar:'اللاحقة "-emesis" تعني:',opts:["Vomiting","Swelling","Inflammation","Digestion"],arOpts:["القيء","التورم","الالتهاب","الهضم"],c:0,exp:"-emesis means vomiting — e.g., hematemesis = vomiting blood.",arExp:'اللاحقة "-emesis" تعني القيء — مثل قيء الدم (hematemesis).'},
{cat:'mcq',q:'What does "melena" refer to?',ar:'ماذا يعني مصطلح "melena"؟',opts:["Yellowing of the skin","Black, tarry stools","Swollen abdomen","Loss of appetite"],arOpts:["اصفرار الجلد","براز أسود قطراني","انتفاخ البطن","فقدان الشهية"],c:1,exp:"Melena refers to black, tarry stools caused by digested blood — usually from upper GI bleeding.",arExp:"البراز الأسود القطراني (Melena) ناتج عن الدم المهضوم — عادةً من نزيف الجهاز الهضمي العلوي."},
{cat:'mcq',q:"The esophagus connects the:",ar:"المريء يصل بين:",opts:["Mouth to stomach","Stomach to small intestine","Liver to pancreas","Large intestine to rectum"],arOpts:["الفم إلى المعدة","المعدة إلى الأمعاء الدقيقة","الكبد إلى البنكرياس","الأمعاء الغليظة إلى المستقيم"],c:0,exp:"The esophagus is the muscular tube connecting the mouth/pharynx to the stomach.",arExp:"المريء هو الأنبوب العضلي الذي يصل بين الفم/البلعوم والمعدة."},
{cat:'mcq',q:"Which term refers to the presence of gallstones?",ar:"أي مصطلح يشير إلى وجود حصوات المرارة؟",opts:["Cholecystitis","Cholelithiasis","Cholecystectomy","Cholelithotomy"],arOpts:["التهاب المرارة","تحصي المرارة","استئصال المرارة","استخراج حصوات المرارة"],c:1,exp:"Cholelithiasis = presence of gallstones. Cholecystitis = inflammation. Cholecystectomy = surgical removal.",arExp:"تحصي المرارة (Cholelithiasis) = وجود حصوات. التهاب المرارة = Cholecystitis. الاستئصال = Cholecystectomy."},
{cat:'mcq',q:'What does "hematemesis" mean?',ar:'ماذا يعني مصطلح "hematemesis"؟',opts:["Blood in the stool","Vomiting blood","Blood in the urine","Pain in the stomach"],arOpts:["دم في البراز","قيء الدم","دم في البول","ألم في المعدة"],c:1,exp:"Hematemesis: hemat (blood) + emesis (vomiting) = vomiting blood, sign of upper GI bleeding.",arExp:"قيء الدم (Hematemesis): hemat (دم) + emesis (قيء) = قيء الدم، علامة على نزيف الجهاز الهضمي العلوي."},
{cat:'mcq',q:"The right atrium receives deoxygenated blood from:",ar:"الأذين الأيمن يستقبل الدم غير المؤكسج من:",opts:["Pulmonary vein","Aorta","Superior and inferior vena cava","Coronary arteries"],arOpts:["الوريد الرئوي","الشريان الأورطي","الوريد الأجوف العلوي والسفلي","الشرايين التاجية"],c:2,exp:"The right atrium receives deoxygenated blood from the body via the superior and inferior vena cava.",arExp:"يستقبل الأذين الأيمن الدم غير المؤكسج من الجسم عبر الوريد الأجوف العلوي والسفلي."},
{cat:'mcq',q:"Which valve is located between the right atrium and right ventricle?",ar:"أي صمام يقع بين الأذين الأيمن والبطين الأيمن؟",opts:["Aortic valve","Pulmonary valve","Mitral valve","Tricuspid valve"],arOpts:["الصمام الأبهري","الصمام الرئوي","الصمام التاجي","الصمام ثلاثي الشُّرَف"],c:3,exp:"The tricuspid valve (3 cusps) separates the right atrium from the right ventricle.",arExp:"الصمام ثلاثي الشُّرَف (Tricuspid valve) يفصل بين الأذين الأيمن والبطين الأيمن."},
{cat:'mcq',q:"What does the term ischemia mean?",ar:"ماذا يعني مصطلح نقص التروية (Ischemia)؟",opts:["Infection in the heart muscle","Lack of blood supply to tissues","Increased blood flow","Abnormal heart rhythm"],arOpts:["عدوى في عضلة القلب","نقص إمداد الدم للأنسجة","زيادة تدفق الدم","اضطراب نظم القلب"],c:1,exp:"Ischemia = insufficient blood supply to tissues, causing oxygen deprivation.",arExp:"نقص التروية (Ischemia) = عدم كفاية إمداد الدم للأنسجة مما يسبب نقص الأكسجين."},
{cat:'mcq',q:"Which term describes the absence of breathing?",ar:"أي مصطلح يصف الغياب التام للتنفس؟",opts:["Dyspnea","Tachypnea","Apnea","Bradypnea"],arOpts:["ضيق التنفس","تسرع التنفس","انقطاع التنفس","بطء التنفس"],c:2,exp:"Apnea: a (without) + pnea (breathing) = complete absence of breathing.",arExp:"انقطاع النفس (Apnea): a (بدون) + pnea (تنفس) = الغياب التام للتنفس."},
{cat:'mcq',q:"The medical term for difficulty breathing is:",ar:"المصطلح الطبي لصعوبة التنفس هو:",opts:["Tachypnea","Dyspnea","Apnea","Orthopnea"],arOpts:["تسرع التنفس","ضيق التنفس","انقطاع التنفس","التنفس الانتصابي"],c:1,exp:"Dyspnea: dys (difficult) + pnea (breathing) = labored or difficult breathing.",arExp:"عسر التنفس (Dyspnea): dys (صعوبة) + pnea (تنفس) = تنفس متعسر أو صعوبة في التنفس."},
{cat:'mcq',q:"What is the medical term for a nosebleed?",ar:"ما هو المصطلح الطبي للرعاف (نزيف الأنف)؟",opts:["Hemoptysis","Epistaxis","Sinusitis","Rhinorrhea"],arOpts:["نفث الدم","الرعاف","التهاب الجيوب الأنفية","سيلان الأنف"],c:1,exp:"Epistaxis is the medical term for nosebleed — bleeding from the nasal passages.",arExp:"الرعاف (Epistaxis) هو المصطلح الطبي لنزيف الأنف — نزيف من تجاويف الأنف."},
{cat:'mcq',q:'The term "hypoxia" means:',ar:'مصطلح "hypoxia" يعني:',opts:["Low oxygen in the blood","Excess oxygen in the blood","High carbon dioxide levels","Normal oxygen levels"],arOpts:["انخفاض الأكسجين في الأنسجة","فرط الأكسجين في الدم","ارتفاع مستويات ثاني أكسيد الكربون","مستويات أكسجين طبيعية"],c:0,exp:"Hypoxia: hypo (low) + ox (oxygen) + ia (condition) = deficiency of oxygen in tissues.",arExp:"نقص الأكسجة (Hypoxia): hypo (منخفض) + ox (أكسجين) = نقص الأكسجين في الأنسجة."},
{cat:'mcq',q:'The suffix "-ectasis" means:',ar:'اللاحقة "-ectasis" تعني:',opts:["Narrowing","Expansion or dilation","Inflammation","Surgical removal"],arOpts:["تضيق","توسع أو اتساع","التهاب","الاستئصال الجراحي"],c:1,exp:"-ectasis means expansion or dilation — e.g., bronchiectasis = dilation of bronchi.",arExp:'اللاحقة "-ectasis" تعني التوسع أو الاتساع — مثل توسع القصبات (bronchiectasis).'},
{cat:'mcq',q:"What is the term for the surgical removal of the appendix?",ar:"ما هو المصطلح لاستئصال الزائدة الدودية جراحيًا؟",opts:["Cholecystectomy","Hysterectomy","Appendectomy","Gastrectomy"],arOpts:["استئصال المرارة","استئصال الرحم","استئصال الزائدة الدودية","استئصال المعدة"],c:2,exp:"Appendectomy: appendix + ectomy (removal) = surgical removal of the appendix.",arExp:"استئصال الزائدة الدودية (Appendectomy): appendix + ectomy (استئصال) = الإزالة الجراحية للزائدة الدودية."},
{cat:'mcq',q:"What is the term for a doctor who specializes in the treatment of Heart diseases?",ar:"ما هو المصطلح لطبيب متخصص في أمراض القلب؟",opts:["Oncologist","Cardiologist","Neurologist","Dermatologist"],arOpts:["أخصائي الأورام","طبيب القلب","طبيب الأعصاب","طبيب الجلدية"],c:1,exp:"Cardiologist: cardi (heart) + ologist (specialist) = a specialist in heart diseases.",arExp:"طبيب القلب (Cardiologist): cardi (قلب) + ologist (أخصائي) = أخصائي في أمراض القلب."},
{cat:'mcq',q:"What is the term for the surgical removal of the gallbladder? (v2)",ar:"ما هو المصطلح لاستئصال المرارة جراحيًا؟ (٢)",opts:["Colectomy","Gastrectomy","Cholecystectomy","Hysterectomy"],arOpts:["استئصال القولون","استئصال المعدة","استئصال المرارة","استئصال الرحم"],c:2,exp:"Cholecystectomy = surgical removal of the gallbladder. A colectomy removes the colon.",arExp:"استئصال المرارة (Cholecystectomy) = الاستئصال الجراحي للمرارة. استئصال القولون يزيل القولون."},
{cat:'mcq',q:"______ is surgical puncture to aspirate fluid from the abdomen.",ar:"______ هو الثقب الجراحي لشفط السوائل من البطن.",opts:["Abdominocentesis","Amniocentesis","Arthrocentesis","Arthroscopy"],arOpts:["ثقب البطن","ثقب السلى","ثقب المفصل","تنظير المفصل"],c:0,exp:"Abdominocentesis: abdomen + centesis (surgical puncture) = aspiration of fluid from the abdomen.",arExp:"ثقب البطن (Abdominocentesis): abdomen + centesis (ثقب جراحي) = شفط السوائل من البطن."},
{cat:'mcq',q:"What is the term for abnormally swollen veins in the lower esophagus, often associated with liver disease?",ar:"ما هو المصطلح للأوردة المتضخمة في الجزء السفلي من المريء المرتبطة بأمراض الكبد؟",opts:["Hemorrhoids","Esophageal varices","Crohn's disease","Diverticulitis"],arOpts:["البواسير","دوالي المريء","مرض كرون","التهاب الرتوج"],c:1,exp:"Esophageal varices = dilated submucosal veins in the esophagus, commonly due to portal hypertension.",arExp:"دوالي المريء (Esophageal varices) = توسع الأوردة في المريء، شائعة في ارتفاع ضغط الوريد البابي."},
{cat:'mcq',q:"What is the term for swollen, enlarged veins inside and outside the anus and rectum?",ar:"ما هو المصطلح للأوردة المتضخمة داخل وخارج فتحة الشرج والمستقيم؟",opts:["Hemorrhoids","Esophageal varices","Crohn's disease","Diverticulitis"],arOpts:["البواسير","دوالي المريء","مرض كرون","التهاب الرتوج"],c:0,exp:"Hemorrhoids = swollen and enlarged veins in the anus and rectum — very common condition.",arExp:"البواسير (Hemorrhoids) = أوردة متضخمة في الشرج والمستقيم — حالة شائعة جدًا."},
{cat:'mcq',q:"A/an _____ is a surgical incision into the colon.",ar:"_____ هو شق جراحي في القولون.",opts:["Colostomy","Colectomy","Colotomy","Chyme"],arOpts:["فغر القولون","استئصال القولون","شق القولون","الكيموس"],c:2,exp:"Colotomy: col (colon) + otomy (incision) = surgical incision into the colon.",arExp:"شق القولون (Colotomy): col (قولون) + otomy (شق) = الشق الجراحي للقولون."},
{cat:'mcq',q:"What is the term for surgical repair of the abdomen?",ar:"ما هو المصطلح لإصلاح البطن جراحيًا؟",opts:["Colectomy","Abdominocentesis","Abdominoplasty","Celiotomy"],arOpts:["استئصال القولون","ثقب البطن","رأب البطن","شق تجويف البطن"],c:2,exp:"Abdominoplasty: abdomen + plasty (surgical repair/reshaping) = surgical repair of the abdomen.",arExp:"رأب البطن (Abdominoplasty): abdomen + plasty (إصلاح جراحي) = الإصلاح الجراحي لجدار البطن."},
{cat:'mcq',q:"What is the term for creation of an artificial opening in the colon?",ar:"ما هو المصطلح لإنشاء فتحة اصطناعية في القولون؟",opts:["Colectomy","Colostomy","Colotomy","Celiotomy"],arOpts:["استئصال القولون","فغر القولون","شق القولون","شق تجويف البطن"],c:1,exp:"Colostomy: col (colon) + ostomy (artificial opening) = creation of a stoma in the colon.",arExp:"فغر القولون (Colostomy): col (قولون) + ostomy (فتحة اصطناعية) = إنشاء فتحة في القولون."},
{cat:'mcq',q:"The term 'Laparotomy' refers to the incision into which organ?",ar:"مصطلح 'Laparotomy' يشير إلى الشق في أي عضو أو تجويف؟",opts:["Stomach","Gallbladder","Appendix","Abdominal cavity"],arOpts:["المعدة","المرارة","الزائدة الدودية","تجويف البطن"],c:3,exp:"Laparotomy: lapar (abdomen/flank) + otomy (incision) = surgical incision into the abdominal cavity.",arExp:"شق البطن (Laparotomy): lapar (بطن) + otomy (شق) = الشق الجراحي لتجويف البطن."},
{cat:'mcq',q:"What is the term for study of disease and disorders of the rectum?",ar:"ما هو المصطلح لدراسة أمراض واضطرابات المستقيم؟",opts:["Cardiology","Proctology","Proctoptosis","Nephrology"],arOpts:["طب القلب","طب المستقيم","هبوط المستقيم","طب الكلى"],c:1,exp:"Proctology: proct (rectum) + ology (study of) = medical specialty for rectal and anal disorders.",arExp:"طب المستقيم (Proctology): proct (مستقيم) + ology (دراسة) = التخصص الطبي لاضطرابات المستقيم والشرج."},
{cat:'mcq',q:"What is the term for inflammation of irregular bulging pouches in the wall of the large intestine?",ar:"ما هو المصطلح لالتهاب الحويصلات البارزة في جدار الأمعاء الغليظة؟",opts:["Stomatitis","Steatohepatitis","Glossitis","Diverticulitis"],arOpts:["التهاب الفم","التهاب الكبد الدهني","التهاب اللسان","التهاب الرتوج"],c:3,exp:"Diverticulitis = inflammation of diverticula (small pouches) in the wall of the large intestine.",arExp:"التهاب الرتوج (Diverticulitis) = التهاب الحويصلات الصغيرة في جدار الأمعاء الغليظة."},
{cat:'mcq',q:"Which term refers to a movement that decreases the angle of a joint?",ar:"أي مصطلح يشير إلى حركة تقلل من زاوية المفصل؟",opts:["Flexion","Extension","Abduction","Adduction"],arOpts:["الانثناء","الامتداد","الإبعاد","التقريب"],c:0,exp:"Flexion decreases the angle between two body parts — e.g., bending the elbow.",arExp:"الانثناء (Flexion) يقلل الزاوية بين جزأين من الجسم — مثل ثني الكوع."},
{cat:'mcq',q:"Which of the following statements describes abduction of a joint?",ar:"أي من العبارات التالية يصف حركة الإبعاد للمفصل؟",opts:["Decreases the joint angle","Movement away from the midline","Increases the joint angle","Movement towards the midline"],arOpts:["تقلل زاوية المفصل","حركة بعيداً عن خط المنتصف","تزيد زاوية المفصل","حركة نحو خط المنتصف"],c:1,exp:"Abduction = movement AWAY from the midline of the body — e.g., raising the arm sideways.",arExp:"الإبعاد (Abduction) = حركة بعيدة عن خط منتصف الجسم — مثل رفع الذراع جانباً."},
{cat:'mcq',q:"Which term describes the movement of a body part AWAY from the midline of the body?",ar:"أي مصطلح يصف حركة جزء من الجسم بعيداً عن خط المنتصف؟",opts:["Flexion","Extension","Abduction","Adduction"],arOpts:["الانثناء","الامتداد","الإبعاد","التقريب"],c:2,exp:"Abduction: ab (away) + duction (movement) = moving away from the midline of the body.",arExp:"الإبعاد (Abduction): ab (بعيد) + duction (حركة) = التحرك بعيداً عن خط منتصف الجسم."},
{cat:'mcq',q:"Which term describes the movement of a body part TOWARDS the midline of the body?",ar:"أي مصطلح يصف حركة جزء من الجسم نحو خط المنتصف؟",opts:["Flexion","Extension","Abduction","Adduction"],arOpts:["الانثناء","الامتداد","الإبعاد","التقريب"],c:3,exp:"Adduction: ad (toward) + duction (movement) = moving toward the midline of the body.",arExp:"التقريب (Adduction): ad (نحو) + duction (حركة) = التحرك نحو خط منتصف الجسم."},
{cat:'mcq',q:"Which term describes the movement of the foot pointing more superiorly?",ar:"أي مصطلح يصف حركة القدم نحو الأعلى (نحو الساق)؟",opts:["Flexion","Dorsiflexion","Abduction","Plantarflexion"],arOpts:["الانثناء","الانثناء الظهري","الإبعاد","الانثناء الأخمصي"],c:1,exp:"Dorsiflexion = pulling the foot upward toward the shin — decreasing the angle between foot and leg.",arExp:"الانثناء الظهري (Dorsiflexion) = شد القدم للأعلى نحو الساق — تقليل الزاوية بين القدم والساق."},
{cat:'mcq',q:"Which term describes the movement of the hand or foot turning upward?",ar:"أي مصطلح يصف دوران اليد أو القدم للأعلى؟",opts:["Pronation","Dorsiflexion","Supination","Plantarflexion"],arOpts:["الكب (للأسفل)","الانثناء الظهري","البسط (للأعلى)","الانثناء الأخمصي"],c:2,exp:"Supination = rotation of the forearm/hand so the palm faces upward, or foot turns outward.",arExp:"البسط (Supination) = دوران الساعد/اليد بحيث يواجه راحة اليد الأعلى، أو دوران القدم للخارج."},
{cat:'mcq',q:"Which term describes the movement of the hand or foot turning downward?",ar:"أي مصطلح يصف دوران اليد أو القدم للأسفل؟",opts:["Pronation","Dorsiflexion","Supination","Plantarflexion"],arOpts:["الكب (للأسفل)","الانثناء الظهري","البسط (للأعلى)","الانثناء الأخمصي"],c:0,exp:"Pronation = rotation of the forearm/hand so the palm faces downward, or foot turns inward.",arExp:"الكب (Pronation) = دوران الساعد/اليد بحيث تواجه راحة اليد الأسفل، أو دوران القدم للداخل."},
{cat:'mcq',q:"Which term refers to a movement that increases the angle of a joint?",ar:"أي مصطلح يشير إلى حركة تزيد من زاوية المفصل؟",opts:["Flexion","Extension","Abduction","Adduction"],arOpts:["الانثناء","الامتداد","الإبعاد","التقريب"],c:1,exp:"Extension increases the angle between two body parts — e.g., straightening the elbow.",arExp:"الامتداد (Extension) يزيد الزاوية بين جزأين من الجسم — مثل تمديد الكوع."},
{cat:'mcq',q:'The term "Hyperthyroidism" describes:',ar:'مصطلح "Hyperthyroidism" يصف:',opts:["Excessive thyroid gland activity","Deficient secretion of thyroid hormones","Inflammation of the thyroid gland","Enlargement of the thyroid gland"],arOpts:["فرط نشاط الغدة الدرقية","نقص إفراز هرمونات الغدة الدرقية","التهاب الغدة الدرقية","تضخم الغدة الدرقية"],c:0,exp:"Hyperthyroidism: hyper (excessive) + thyroid + ism = overactivity of the thyroid gland producing excess hormones.",arExp:"فرط نشاط الغدة الدرقية (Hyperthyroidism): hyper (مفرط) + thyroid = فرط نشاط الغدة وإنتاج هرمونات زائدة."},
{cat:'mcq',q:'The term "hyperglycemia" refers to:',ar:'مصطلح "hyperglycemia" يشير إلى:',opts:["Abnormally low blood sugar","Abnormally high blood calcium","Abnormally high blood sugar","Abnormally low blood potassium"],arOpts:["انخفاض غير طبيعي لسكر الدم","ارتفاع غير طبيعي لكالسيوم الدم","ارتفاع غير طبيعي لسكر الدم","انخفاض غير طبيعي لبوتاسيوم الدم"],c:2,exp:"Hyperglycemia: hyper (high) + glyc (sugar) + emia (blood condition) = abnormally high blood sugar.",arExp:"ارتفاع سكر الدم (Hyperglycemia): hyper (مرتفع) + glyc (سكر) + emia (دم) = ارتفاع غير طبيعي لسكر الدم."},
{cat:'mcq',q:'The term "Hyponatremia" refers to:',ar:'مصطلح "Hyponatremia" يشير إلى:',opts:["Abnormally low blood sugar","Abnormally high blood calcium","Abnormally low blood sodium","Abnormally low blood potassium"],arOpts:["انخفاض غير طبيعي لسكر الدم","ارتفاع غير طبيعي لكالسيوم الدم","انخفاض غير طبيعي لصوديوم الدم","انخفاض غير طبيعي لبوتاسيوم الدم"],c:2,exp:"Hyponatremia: hypo (low) + natr (sodium) + emia (blood) = abnormally low blood sodium levels.",arExp:"نقص صوديوم الدم (Hyponatremia): hypo (منخفض) + natr (صوديوم) + emia (دم) = انخفاض غير طبيعي للصوديوم."},
{cat:'mcq',q:'The term "polydipsia" refers to:',ar:'مصطلح "polydipsia" يشير إلى:',opts:["Excessive thirst","Excessive urination","Excessive hunger","Excessive sweating"],arOpts:["عطش مفرط","تبول مفرط","جوع مفرط","تعرق مفرط"],c:0,exp:"Polydipsia: poly (many/excessive) + dipsia (thirst) = condition of excessive thirst, seen in diabetes.",arExp:"العطش المفرط (Polydipsia): poly (مفرط) + dipsia (عطش) = حالة من العطش المفرط، شائعة في مرض السكري."},
{cat:'mcq',q:'The term "thyroidectomy" refers to the:',ar:'مصطلح "thyroidectomy" يشير إلى:',opts:["Inflammation of the thyroid gland","Surgical removal of the thyroid gland","Enlargement of the thyroid gland","Overactivity of the thyroid gland"],arOpts:["التهاب الغدة الدرقية","الاستئصال الجراحي للغدة الدرقية","تضخم الغدة الدرقية","فرط نشاط الغدة الدرقية"],c:1,exp:"Thyroidectomy: thyroid + ectomy (removal) = surgical removal of the thyroid gland.",arExp:"استئصال الغدة الدرقية (Thyroidectomy): thyroid + ectomy (استئصال) = الاستئصال الجراحي للغدة الدرقية."},
{cat:'mcq',q:'The term "pancreatitis" refers to the:',ar:'مصطلح "pancreatitis" يشير إلى:',opts:["Surgical removal of the pancreas","Inflammation of the pancreas","Underactivity of the pancreas","Overactivity of the pancreas"],arOpts:["استئصال البنكرياس","التهاب البنكرياس","قصور البنكرياس","فرط نشاط البنكرياس"],c:1,exp:"Pancreatitis: pancreato + itis (inflammation) = inflammation of the pancreas.",arExp:"التهاب البنكرياس (Pancreatitis): pancreato + itis (التهاب) = التهاب البنكرياس."},
{cat:'mcq',q:"Which term refers to a condition of excessive thyroid hormone production?",ar:"أي مصطلح يشير إلى حالة فرط إنتاج هرمون الغدة الدرقية؟",opts:["Hypothyroidism","Hyperthyroidism","Thyroiditis","Thyroidectomy"],arOpts:["قصور الغدة الدرقية","فرط نشاط الغدة الدرقية","التهاب الغدة الدرقية","استئصال الغدة الدرقية"],c:1,exp:"Hyperthyroidism = excessive production of thyroid hormones (T3/T4) by the thyroid gland.",arExp:"فرط نشاط الغدة الدرقية (Hyperthyroidism) = الإنتاج المفرط لهرمونات الغدة الدرقية (T3/T4)."},
{cat:'mcq',q:'What does the prefix "adreno-" refer to in medical terminology?',ar:'ماذا تعني البادئة "adreno-" في المصطلحات الطبية؟',opts:["Liver","Pancreas","Kidney","Adrenal gland"],arOpts:["الكبد","البنكرياس","الكلية","الغدة الكظرية"],c:3,exp:"Adreno- refers to the adrenal glands — located on top of the kidneys. E.g., adrenalectomy.",arExp:'"adreno-" تشير إلى الغدد الكظرية — الموجودة فوق الكلى. مثال: استئصال الغدة الكظرية (adrenalectomy).'},
{cat:'mcq',q:'What does "hypoglycemia" mean?',ar:'ماذا يعني مصطلح "hypoglycemia"؟',opts:["High thyroid hormone","Low calcium in the blood","Low blood sugar","Excess insulin"],arOpts:["ارتفاع هرمون الغدة الدرقية","انخفاض الكالسيوم في الدم","انخفاض سكر الدم","فرط الأنسولين"],c:2,exp:"Hypoglycemia: hypo (low) + glyc (sugar) + emia (blood) = abnormally low blood sugar levels.",arExp:"انخفاض سكر الدم (Hypoglycemia): hypo (منخفض) + glyc (سكر) + emia (دم) = انخفاض غير طبيعي لسكر الدم."},
{cat:'mcq',q:'What is the medical term for "enlarged thyroid"?',ar:'ما هو المصطلح الطبي لـ"تضخم الغدة الدرقية"؟',opts:["Thyroiditis","Thyromegaly","Hyperthyroidism","Goitrectomy"],arOpts:["التهاب الغدة الدرقية","تضخم الغدة الدرقية","فرط نشاط الغدة الدرقية","استئصال الدراق"],c:1,exp:"Thyromegaly: thyro (thyroid) + megaly (enlargement) = enlargement of the thyroid gland (goiter).",arExp:"تضخم الغدة الدرقية (Thyromegaly): thyro (درقية) + megaly (تضخم) = تضخم الغدة الدرقية (الدُّراق)."},
{cat:'mcq',q:'Which prefix means "under" or "below normal"?',ar:'أي بادئة تعني "تحت" أو "أقل من الطبيعي"؟',opts:["Hyper-","Dys-","Hypo-","Anti-"],arOpts:["هايبر- (فوق/مفرط)","ديس- (صعوبة/خلل)","هايبو- (تحت/ناقص)","أنتي- (ضد)"],c:2,exp:"Hypo- means under, below, or deficient — e.g., hypoglycemia, hyponatremia, hypothyroidism.",arExp:'"hypo-" تعني تحت أو أقل من الطبيعي — مثل انخفاض السكر وقصور الدرقية.'},
{cat:'mcq',q:'"Pancreatectomy" refers to:',ar:'"Pancreatectomy" يشير إلى:',opts:["Enlargement of the pancreas","Inflammation of the pancreas","Surgical removal of the pancreas","Dysfunction of the pancreas"],arOpts:["تضخم البنكرياس","التهاب البنكرياس","الاستئصال الجراحي للبنكرياس","خلل وظيفي في البنكرياس"],c:2,exp:"Pancreatectomy: pancreato + ectomy (removal) = surgical removal of the pancreas.",arExp:"استئصال البنكرياس (Pancreatectomy): pancreato + ectomy (استئصال) = الاستئصال الجراحي للبنكرياس."},
{cat:'mcq',q:"Which condition results from hypersecretion of growth hormone in adults?",ar:"أي حالة تنتج عن فرط إفراز هرمون النمو عند البالغين؟",opts:["Gigantism","Dwarfism","Acromegaly","Hypopituitarism"],arOpts:["العملقة","القزامة","ضخامة النهايات","قصور الغدة النخامية"],c:2,exp:"Acromegaly = hypersecretion of GH in ADULTS → enlargement of hands, feet, and face after growth plates close.",arExp:"ضخامة النهايات (Acromegaly) = فرط إفراز هرمون النمو عند البالغين → تضخم اليدين والقدمين والوجه."},
{cat:'mcq',q:'What does "Hypercalcemia" mean?',ar:'ماذا يعني مصطلح "Hypercalcemia"؟',opts:["High thyroid hormone","High calcium in the blood","High blood sugar","High potassium in the blood"],arOpts:["ارتفاع هرمون الغدة الدرقية","ارتفاع الكالسيوم في الدم","ارتفاع سكر الدم","ارتفاع البوتاسيوم في الدم"],c:1,exp:"Hypercalcemia: hyper (high) + calc (calcium) + emia (blood) = abnormally high blood calcium levels.",arExp:"فرط كالسيوم الدم (Hypercalcemia): hyper (مرتفع) + calc (كالسيوم) + emia (دم) = ارتفاع غير طبيعي للكالسيوم."},
{cat:'mcq',q:'What does "Hyperkalemia" mean?',ar:'ماذا يعني مصطلح "Hyperkalemia"؟',opts:["High thyroid hormone","High calcium in the blood","High blood sugar","High potassium in the blood"],arOpts:["ارتفاع هرمون الغدة الدرقية","ارتفاع الكالسيوم في الدم","ارتفاع سكر الدم","ارتفاع البوتاسيوم في الدم"],c:3,exp:"Hyperkalemia: hyper (high) + kal (potassium) + emia (blood) = abnormally high blood potassium levels.",arExp:"فرط بوتاسيوم الدم (Hyperkalemia): hyper (مرتفع) + kal (بوتاسيوم) + emia (دم) = ارتفاع غير طبيعي للبوتاسيوم."},
{cat:'mcq',q:'What does "Adenosis" mean?',ar:'ماذا يعني مصطلح "Adenosis"؟',opts:["Enlarged gland","Abnormal condition of a gland","Excision of the adrenal glands","Inflammation of the gland"],arOpts:["تضخم الغدة","حالة غير طبيعية للغدة","استئصال الغدد الكظرية","التهاب الغدة"],c:1,exp:"Adenosis: aden (gland) + osis (abnormal condition) = any abnormal condition or disease of a gland.",arExp:"الغدية الشاذة (Adenosis): aden (غدة) + osis (حالة غير طبيعية) = أي حالة مرضية في الغدة."},
{cat:'mcq',q:"Which condition is caused by hypersecretion of growth hormone in children?",ar:"أي حالة تنتج عن فرط إفراز هرمون النمو عند الأطفال؟",opts:["Acromegaly","Gigantism","Dwarfism","Diabetes"],arOpts:["ضخامة النهايات","العملقة","القزامة","السكري"],c:1,exp:"Gigantism = hypersecretion of GH in CHILDREN (before growth plates close) → abnormally tall stature.",arExp:"العملقة (Gigantism) = فرط إفراز هرمون النمو عند الأطفال (قبل إغلاق لوحات النمو) → طول شاذ."},
{cat:'mcq',q:"Which prefix refers to skin in medical terms?",ar:"أي بادئة تشير إلى الجلد في المصطلحات الطبية؟",opts:["Myo-","Derma-","Neuro-","Hepato-"],arOpts:["ميو- (عضلات)","ديرما- (جلد)","نيورو- (أعصاب)","هيباتو- (كبد)"],c:1,exp:"Derma- (or dermato-) refers to skin — e.g., dermatitis, dermatology, dermatoplasty.",arExp:'"Derma-" أو "dermato-" تشير إلى الجلد — مثل التهاب الجلد وطب الجلدية ورأب الجلد.'},
{cat:'mcq',q:"What does the term subcutaneous mean?",ar:"ماذا يعني مصطلح subcutaneous؟",opts:["Beneath the skin","Over the skin","Through the skin","Around the skin"],arOpts:["تحت الجلد","فوق الجلد","عبر الجلد","حول الجلد"],c:0,exp:"Subcutaneous: sub (beneath) + cutane (skin) + ous = located or administered beneath the skin.",arExp:"تحت الجلد (Subcutaneous): sub (تحت) + cutane (جلد) = موضوع أو يُعطى تحت الجلد."},
{cat:'mcq',q:"The term dermatitis means:",ar:"مصطلح dermatitis يعني:",opts:["Skin tumor","Skin inflammation","Skin pain","Skin hardening"],arOpts:["ورم جلدي","التهاب الجلد","ألم الجلد","تصلب الجلد"],c:1,exp:"Dermatitis: dermat (skin) + itis (inflammation) = inflammation of the skin causing redness, itching.",arExp:"التهاب الجلد (Dermatitis): dermat (جلد) + itis (التهاب) = التهاب الجلد مع احمرار وحكة."},
{cat:'mcq',q:"What is the term for a fatty tumor under the skin?",ar:"ما هو المصطلح للورم الدهني تحت الجلد؟",opts:["Melanoma","Carcinoma","Lipoma","Fibroma"],arOpts:["الورم الميلانيني","السرطانة الظهارية","الورم الدهني","الورم الليفي"],c:2,exp:"Lipoma: lip (fat) + oma (tumor) = a benign soft tumor of fatty tissue located under the skin.",arExp:"الورم الدهني (Lipoma): lip (دهن) + oma (ورم) = ورم حميد من الأنسجة الدهنية تحت الجلد."},
{cat:'mcq',q:"Which condition is a fungal infection of the skin?",ar:"أي حالة هي عدوى فطرية للجلد؟",opts:["Psoriasis","Tinea","Eczema","Urticaria"],arOpts:["الصدفية","السَّعَفة (عدوى فطرية)","الأكزيما","الشرى"],c:1,exp:"Tinea is a fungal infection of the skin — includes ringworm (tinea corporis), athlete's foot (tinea pedis).",arExp:"السَّعَفة (Tinea) هي عدوى فطرية للجلد — تشمل القوباء الحلقية وقدم الرياضي."},
{cat:'mcq',q:"What does melanoma mean?",ar:"ماذا يعني مصطلح melanoma؟",opts:["Tumor of fat","Skin inflammation","Malignant tumor of pigment cells","Infection of sebaceous gland"],arOpts:["ورم دهني","التهاب الجلد","ورم خبيث في خلايا الصباغ","عدوى الغدد الدهنية"],c:2,exp:"Melanoma: melan (black/pigment) + oma (tumor) = malignant tumor arising from melanocytes (pigment cells).",arExp:"الورم الميلانيني (Melanoma): melan (أسود/صباغ) + oma (ورم) = ورم خبيث ينشأ من الخلايا الميلانينية."},
{cat:'mcq',q:"Which term means plastic surgery of the skin?",ar:"أي مصطلح يعني جراحة تجميل الجلد؟",opts:["Dermatoplasty","Dermectomy","Dermoscopy","Dermatitis"],arOpts:["رأب الجلد","استئصال الجلد","تنظير الجلد","التهاب الجلد"],c:0,exp:"Dermatoplasty: dermato (skin) + plasty (surgical repair) = plastic surgery to repair or reshape skin.",arExp:"رأب الجلد (Dermatoplasty): dermato (جلد) + plasty (إصلاح جراحي) = الجراحة التجميلية لإصلاح الجلد."},
{cat:'mcq',q:"What is the meaning of onychomycosis?",ar:"ما هو معنى مصطلح onychomycosis؟",opts:["Nail inflammation","Nail fungus infection","Nail discoloration","Nail removal"],arOpts:["التهاب الأظافر","عدوى فطرية للأظافر","تغير لون الأظافر","استئصال الأظافر"],c:1,exp:"Onychomycosis: onych (nail) + myco (fungus) + osis (condition) = fungal infection of the nail.",arExp:"فطار الأظافر (Onychomycosis): onych (ظفر) + myco (فطر) + osis (حالة) = عدوى فطرية للأظافر."},
{cat:'mcq',q:"Which term refers to sweat glands?",ar:"أي مصطلح يشير إلى الغدد العرقية؟",opts:["Sebaceous","Apocrine","Eccrine","Sudoriferous"],arOpts:["الدهنية (زيت)","الأبوكرينية","الإيكرينية","العرقية"],c:3,exp:"Sudoriferous glands are sweat glands. Sebaceous glands produce oil (sebum). Sudor = sweat in Latin.",arExp:"الغدد العرقية (Sudoriferous glands) هي الغدد التي تنتج العرق. الغدد الدهنية (Sebaceous) تنتج الزيت."},
{cat:'mcq',q:"What does hidradenitis mean?",ar:"ماذا يعني مصطلح hidradenitis؟",opts:["Inflammation of sebaceous glands","Inflammation of sweat glands","Inflammation of hair follicles","Inflammation of subcutaneous tissue"],arOpts:["التهاب الغدد الدهنية","التهاب الغدد العرقية","التهاب بصيلات الشعر","التهاب الأنسجة تحت الجلد"],c:1,exp:"Hidradenitis: hidr (sweat) + aden (gland) + itis (inflammation) = inflammation of sweat glands.",arExp:"التهاب الغدد العرقية (Hidradenitis): hidr (عرق) + aden (غدة) + itis (التهاب) = التهاب الغدد العرقية."},
{cat:'mcq',q:"Which of the following best defines carcinoma?",ar:"أي مما يلي يعرّف السرطانة (carcinoma) بشكل أفضل؟",opts:["Benign tumor","Malignant skin cancer","Inflammatory skin disease","Fungal infection"],arOpts:["ورم حميد","سرطان جلدي خبيث","مرض جلدي التهابي","عدوى فطرية"],c:1,exp:"Carcinoma = malignant cancer arising from epithelial cells — a type of malignant skin cancer among others.",arExp:"السرطانة (Carcinoma) = سرطان خبيث ينشأ من الخلايا الظهارية — نوع من السرطان الخبيث."},
{cat:'mcq',q:"Which cells produce melanin?",ar:"أي خلايا تنتج الميلانين (صباغ الجلد)؟",opts:["Keratinocytes","Melanocytes","Fibroblasts","Langerhans cells"],arOpts:["الخلايا الكيراتينية","الخلايا الميلانينية","الخلايا الليفية","خلايا لانغرهانس"],c:1,exp:"Melanocytes are specialized cells in the epidermis that produce melanin — the pigment giving skin its color.",arExp:"الخلايا الميلانينية (Melanocytes) هي خلايا متخصصة في البشرة تنتج الميلانين — صباغ لون الجلد."},
{cat:'mcq',q:"What is the outer, protective layer of the skin?",ar:"ما هي الطبقة الخارجية الواقية للجلد؟",opts:["Epidermis","Stratum basale","Dermis","Subcutaneous fat"],arOpts:["البشرة","الطبقة القاعدية","الأدمة","الدهون تحت الجلد"],c:0,exp:"The epidermis is the outermost layer of skin — provides a waterproof barrier and creates skin tone.",arExp:"البشرة (Epidermis) هي الطبقة الخارجية للجلد — توفر حاجزاً مانعاً للماء وتحدد لون الجلد."},
{cat:'mcq',q:"What is the meaning of Onychophagia?",ar:"ما هو معنى مصطلح Onychophagia؟",opts:["Nail inflammation","Nail fungus infection","Nail discoloration","Nail biting"],arOpts:["التهاب الأظافر","عدوى فطرية للأظافر","تغير لون الأظافر","قضم الأظافر"],c:3,exp:"Onychophagia: onych (nail) + phagia (eating/biting) = compulsive nail biting habit.",arExp:"قضم الأظافر (Onychophagia): onych (ظفر) + phagia (أكل/عض) = عادة قضم الأظافر القهرية."},
{cat:'mcq',q:"What is the meaning of Onychocryptosis?",ar:"ما هو معنى مصطلح Onychocryptosis؟",opts:["Nail inflammation","Nail fungus infection","An ingrown nail","Nail biting"],arOpts:["التهاب الأظافر","عدوى فطرية للأظافر","الظفر المتعمق","قضم الأظافر"],c:2,exp:"Onychocryptosis: onych (nail) + crypt (hidden) + osis (condition) = ingrown nail condition.",arExp:"الظفر المتعمق (Onychocryptosis): onych (ظفر) + crypt (مخفي) + osis (حالة) = حالة الظفر المتعمق."},
{cat:'mcq',q:"Which combining form means nail?",ar:"أي جذر مركب يعني الظفر؟",opts:["Trich/o","Seb/o","Onych/o","Pil/o"],arOpts:["تريكو (شعر)","سيبو (دهون)","أونيكو (أظافر)","بيلو (شعر)"],c:2,exp:"Onych/o is the combining form for nail — used in onychomycosis, onychophagia, etc.",arExp:'"Onych/o" هو الجذر المركب للظفر — يُستخدم في مصطلحات مثل فطار الأظافر وقضم الأظافر.'},
{cat:'mcq',q:"Which of the following is not part of the integumentary system?",ar:"أي مما يلي لا يُعدّ جزءًا من الجهاز التغطائي؟",opts:["Skin","Hair","Teeth","Nails"],arOpts:["الجلد","الشعر","الأسنان","الأظافر"],c:2,exp:"Teeth are part of the digestive system. The integumentary system includes skin, hair, nails, and glands.",arExp:"الأسنان جزء من الجهاز الهضمي. الجهاز التغطائي يشمل الجلد والشعر والأظافر والغدد."},
{cat:'mcq',q:"A white discoloration of the skin is called:",ar:"تغير لون الجلد إلى الأبيض يُسمى:",opts:["Melanosis","Leukoderma","Erythema","Xanthoderma"],arOpts:["الميلانوزيس (تصبغ)","الجلد الأبيض","الحمامى (احمرار)","الجلد الأصفر"],c:1,exp:"Leukoderma: leuko (white) + derma (skin) = white patches or discoloration of the skin.",arExp:"الجلد الأبيض (Leukoderma): leuko (أبيض) + derma (جلد) = بقع بيضاء أو تغير لون الجلد إلى الأبيض."},
{cat:'mcq',q:"Yellow discoloration of the skin is termed:",ar:"تغير لون الجلد إلى الأصفر يُسمى:",opts:["Erythema","Cyanosis","Jaundice","Melanoma"],arOpts:["الحمامى (احمرار)","الزرقة","اليرقان","الورم الميلانيني"],c:2,exp:"Jaundice = yellow discoloration of the skin and eyes due to excess bilirubin in the blood.",arExp:"اليرقان (Jaundice) = اصفرار الجلد والعينين بسبب ارتفاع البيليروبين في الدم."},
{cat:'mcq',q:"Swelling caused by fluid retention is:",ar:"التورم الناجم عن احتباس السوائل هو:",opts:["Edema","Erythema","Cyanosis","Jaundice"],arOpts:["الوذمة","الحمامى","الزرقة","اليرقان"],c:0,exp:"Edema = accumulation of excess fluid in tissues causing swelling — can be localized or generalized.",arExp:"الوذمة (Edema) = تراكم السوائل الزائدة في الأنسجة مسببةً تورمًا — قد يكون موضعيًا أو معمَّمًا."},

const ALL=[...MCQ,...TF];

function selectCat(c,btn){
  cat=c;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('qCount').textContent=(c==='all'?ALL:c==='mcq'?MCQ:TF).length;
}

function startQuiz(){
  qs=cat==='all'?[...ALL]:cat==='mcq'?[...MCQ]:[...TF];
  ans=0;cor=0;wr=0;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('quizWrapper').style.display='block';
  document.getElementById('resultsBox').style.display='none';
  document.getElementById('submitBtn').disabled=true;
  render();tick();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  const c=document.getElementById('cardsContainer');
  c.innerHTML='';
  qs.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='q-card';
    d.id='card_'+i;
    const oh=q.opts.map((o,j)=>
      `<button class="opt" id="opt_${i}_${j}" onclick="pick(${i},${j},${q.c})">
        <span class="opt-letter">${q.isTF?(j===0?'T':'F'):L[j]}</span>
        <span class="opt-content">
          <span class="opt-en">${o}</span>
          <span class="opt-ar">${q.arOpts[j]}</span>
        </span>
      </button>`
    ).join('');
    d.innerHTML=`
      <div class="q-header">
        <div class="q-num">${i+1}</div>
        <span class="cat-tag ${q.cat}">${q.cat==='mcq'?'MCQ':'True / False'}</span>
      </div>
      <div class="q-text">
        <div class="q-en">${q.q}</div>
        <div class="q-ar">${q.ar}</div>
      </div>
      <div class="opts">${oh}</div>
      <div class="q-feedback" id="fb_${i}"></div>
    `;
    c.appendChild(d);
  });
}

function pick(i,chosen,ci){
  const q=qs[i];
  for(let j=0;j<q.opts.length;j++){
    const b=document.getElementById('opt_'+i+'_'+j);
    b.disabled=true;
    if(j===ci)b.classList.add('correct');
    else if(j===chosen)b.classList.add('wrong');
  }
  const fb=document.getElementById('fb_'+i);
  const card=document.getElementById('card_'+i);
  const ok=chosen===ci;
  if(ok){cor++;card.classList.add('answered-correct');}
  else{wr++;card.classList.add('answered-wrong');}
  ans++;
  fb.style.display='block';
  fb.className='q-feedback '+(ok?'correct':'wrong');
  fb.innerHTML=`<div class="fb-en">${ok?'✅':'❌'} ${q.exp}</div><div class="fb-ar">${q.arExp}</div>`;
  tick();
  if(ans===qs.length)document.getElementById('submitBtn').disabled=false;
}

function tick(){
  const t=qs.length;
  document.getElementById('sNum').textContent=ans+'/'+t;
  document.getElementById('sC').textContent='✅ '+cor;
  document.getElementById('sW').textContent='❌ '+wr;
  document.getElementById('sP').textContent='📊 '+(t>0?Math.round((cor/t)*100):0)+'%';
  document.getElementById('sFill').style.width=(t>0?(ans/t)*100:0)+'%';
}

function showResults(){
  const box=document.getElementById('resultsBox');
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth'});
  const t=qs.length,p=t>0?Math.round((cor/t)*100):0;
  document.getElementById('rScore').textContent=cor;
  document.getElementById('rTotal').textContent=t;
  document.getElementById('rC').textContent=cor;
  document.getElementById('rW').textContent=wr;
  document.getElementById('rP').textContent=p+'%';
  const msgs=['🌟 Excellent! Keep it up!','👏 Great job!','💪 Good effort!','📚 Keep studying!','🔄 Practice makes perfect!'];
  document.getElementById('rMsg').textContent=p>=90?msgs[0]:p>=75?msgs[1]:p>=60?msgs[2]:p>=40?msgs[3]:msgs[4];
  document.getElementById('ringFg').style.strokeDashoffset=402-(402*p/100);
  const rev=document.getElementById('reviewDiv');
  const wrongs=[];
  qs.forEach((q,i)=>{
    if(Array.from(document.querySelectorAll(`[id^="opt_${i}_"]`)).some(b=>b.classList.contains('wrong')))wrongs.push(q);
  });
  rev.innerHTML=wrongs.length>0
    ?`<h3>❌ Questions to Review (${wrongs.length})</h3>`+wrongs.map(q=>`
      <div class="rev-item wrong">
        <div class="rt-en">${q.q}</div>
        <div class="rt-ar">${q.ar}</div>
        <div class="ans">✅ ${q.opts[q.c]}</div>
        <div class="exp">${q.exp}</div>
        <div class="exp-ar">${q.arExp}</div>
      </div>`).join('')
    :'<h3>🎉 Perfect Score! All questions answered correctly!</h3>';
}

function goHome(){
  document.getElementById('startScreen').style.display='flex';
  document.getElementById('quizWrapper').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('qCount').textContent=ALL.length;
</script>
</body>
</html>
